[project]
name = "panama_datos_abiertos"
version = "0.0.1"
authors = [{ name = "Jose Quesada" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "beautifulsoup4",
    "openpyxl",
    "pandas",
    "pyarrow",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect==17.3.12",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contraloria"]

[tool.ruff]
line-length = 120